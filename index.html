<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Attendance ETL - Supabase Ready</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  <style>
    body { background: #f9fafb; color: #1f2937; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 450px; border: 1px solid #e5e7eb; }
    h2 { margin-top: 0; font-size: 1.25rem; text-align: center; margin-bottom: 2rem; color: #111827; font-weight: 700; }
    .group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.75rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .file-input-wrapper { position: relative; width: 100%; }
    input[type="file"] { 
      width: 100%; padding: 0.5rem; padding-left: 110px; border: 1px solid #d1d5db; border-radius: 6px; 
      box-sizing: border-box; font-size: 0.9rem; position: relative; z-index: 2; background: transparent;
    }
    
    /* Hide native 'No file chosen' text while placeholder is active */
    input[type="file"]:not(.has-file) { color: transparent; }
    /* Reset layout once a file is selected */
    input[type="file"].has-file { color: #1f2937; padding-left: 0.5rem; }

    .file-placeholder { 
      position: absolute; left: 110px; top: 50%; transform: translateY(-50%); 
      color: #9ca3af; font-size: 0.85rem; pointer-events: none; z-index: 1; 
    }

    .btn { width: 100%; padding: 0.8rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; margin-top: 10px; }
    .btn:hover { background: #1d4ed8; }
    .status { margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #9ca3af; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <h2>Data Transformer</h2>
  
  <div class="group">
    <label>1. Activity Master (XLSX)</label>
    <div class="file-input-wrapper">
      <input type="file" id="masterFile" accept=".xlsx" onchange="updateUI(this)">
      <span class="file-placeholder">AAC_ActivityMaster.xlsx</span>
    </div>
  </div>

  <div class="group">
    <label>2. CPR File (XLSX)</label>
    <div class="file-input-wrapper">
      <input type="file" id="cprFile" accept=".xlsx" onchange="updateUI(this)">
      <span class="file-placeholder">CPR2026000001.xlsx</span>
    </div>
  </div>

  <div class="group">
    <label>3. Attendance (CSV)</label>
    <div class="file-input-wrapper">
      <input type="file" id="attendanceFile" accept=".csv" onchange="updateUI(this)">
      <span class="file-placeholder">AACActivityAttendance.csv</span>
    </div>
  </div>

  <button class="btn" onclick="process()">Generate Supabase CSV</button>
  <div id="status" class="status">Waiting for files...</div>
</div>

<script>
  // UI logic to clear the ghost filename and reset padding
  function updateUI(input) {
    const placeholder = input.nextElementSibling;
    if (input.files.length > 0) {
      placeholder.style.display = 'none';
      input.classList.add('has-file');
    } else {
      placeholder.style.display = 'block';
      input.classList.remove('has-file');
    }
  }

  // Date parsing and CSV generation logic follows below...
  // [Remainder of process() and helper functions from previous step]
</script>
</body>
</html>
