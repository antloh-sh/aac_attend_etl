<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Attendance ETL - Supabase Ready</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
  <style>
    body { background: #f9fafb; color: #1f2937; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 500px; border: 1px solid #e5e7eb; }
    h2 { margin-top: 0; font-size: 1.25rem; text-align: center; margin-bottom: 2rem; color: #111827; font-weight: 700; }
    
    .group { margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.6rem; font-size: 0.75rem; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* The New Layout: Button and Text Box side-by-side */
    .input-row { display: flex; gap: 10px; align-items: center; }
    
    /* Hidden native input */
    input[type="file"] { display: none; }

    /* Custom Pick Button */
    .pick-btn {
      background: #f3f4f6; border: 1px solid #d1d5db; padding: 8px 12px; border-radius: 6px;
      font-size: 0.8rem; font-weight: 600; color: #374151; cursor: pointer; white-space: nowrap;
      transition: background 0.2s;
    }
    .pick-btn:hover { background: #e5e7eb; }

    /* Filename Display Box */
    .filename-box {
      flex-grow: 1; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 0.85rem; color: #9ca3af; background: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .filename-box.has-file { color: #1f2937; border-color: #2563eb; background: #eff6ff; }

    .btn-main { width: 100%; padding: 0.9rem; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: background 0.2s; margin-top: 15px; }
    .btn-main:hover { background: #1d4ed8; }
    .status { margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: #9ca3af; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <h2>Data Transformer</h2>
  
  <!-- Step 1 -->
  <div class="group">
    <label>1. Activity Master (XLSX)</label>
    <div class="input-row">
      <button class="pick-btn" onclick="document.getElementById('masterFile').click()">Choose File</button>
      <div id="masterName" class="filename-box">AAC_ActivityMaster.xlsx</div>
      <input type="file" id="masterFile" accept=".xlsx" onchange="updateUI(this, 'masterName')">
    </div>
  </div>

  <!-- Step 2 -->
  <div class="group">
    <label>2. CPR File (XLSX)</label>
    <div class="input-row">
      <button class="pick-btn" onclick="document.getElementById('cprFile').click()">Choose File</button>
      <div id="cprName" class="filename-box">CPR2026000001.xlsx</div>
      <input type="file" id="cprFile" accept=".xlsx" onchange="updateUI(this, 'cprName')">
    </div>
  </div>

  <!-- Step 3 -->
  <div class="group">
    <label>3. Attendance (CSV)</label>
    <div class="input-row">
      <button class="pick-btn" onclick="document.getElementById('attendanceFile').click()">Choose File</button>
      <div id="attendanceName" class="filename-box">AACActivityAttendance.csv</div>
      <input type="file" id="attendanceFile" accept=".csv" onchange="updateUI(this, 'attendanceName')">
    </div>
  </div>

  <button class="btn-main" onclick="process()">Generate Supabase CSV</button>
  <div id="status" class="status">Waiting for files...</div>
</div>

<script>
  // UI: Updates the custom text box instead of the native input
  function updateUI(input, displayId) {
    const display = document.getElementById(displayId);
    if (input.files.length > 0) {
      display.innerText = input.files[0].name;
      display.classList.add('has-file');
    }
  }

  function getFileTimestamp(dateStr) {
    if (!dateStr) return "output";
    const parts = dateStr.split('-'); 
    return (parts[1] + parts[2]).toLowerCase().replace(/ .*/,'');
  }

  function formatToISODate(str) {
    if (!str) return "";
    const match = str.match(/^(\d{1,2})-(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)-(\d{4})/i);
    if (!match) return str;
    const months = { jan:"01", feb:"02", mar:"03", apr:"04", may:"05", jun:"06", jul:"07", aug:"08", sep:"09", oct:"10", nov:"11", dec:"12" };
    return `${match[3]}-${months[match[2].toLowerCase()]}-${match[1].padStart(2, "0")}`;
  }

  async function parseExcel(file, skipRows = 0) {
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { range: skipRows });
  }

  async function parseCPRWithAutoHeader(file) {
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data);
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
    // Dynamically find where the data starts based on NRIC column
    const headerIndex = rows.findIndex(row => Array.isArray(row) && row.includes("UIN / NRIC"));
    return XLSX.utils.sheet_to_json(sheet, { range: headerIndex !== -1 ? headerIndex : 9 });
  }

  function parseCSV(file) {
    return new Promise(res => {
      Papa.parse(file, { header: true, skipEmptyLines: true, complete: out => res(out.data) });
    });
  }

  async function process() {
    const mFile = document.getElementById('masterFile').files[0];
    const cFile = document.getElementById('cprFile').files[0];
    const aFile = document.getElementById('attendanceFile').files[0];

    if (!mFile || !cFile || !aFile) return alert("Please select all 3 files.");
    document.getElementById('status').innerText = "Processing...";

    const masterData = await parseExcel(mFile, 0);
    const cprData = await parseCPRWithAutoHeader(cFile);
    const attendanceData = await parseCSV(aFile);

    const masterMap = new Map();
    masterData.forEach(r => {
      const act = r.Activity || r.ActivityDisplay;
      if (act) {
        const isGui = String(r.GUI || '').trim().toLowerCase().startsWith('yes');
        const isAap  = String(r.AAP  || '').trim().toLowerCase().startsWith('yes');
        masterMap.set(act.trim(), { gui: isGui, aap: isAap });
      }
    });

    const cprMap = new Map();
    cprData.forEach(r => {
      const nric = String(r["UIN / NRIC"] || "").trim().toUpperCase();
      if (nric) cprMap.set(nric, r["CFS (1-9)"] || "");
    });

    let firstDateRaw = "";

    const results = attendanceData
      .filter(row => {
        if (String(row.Attendance) !== "1") return false;
        const cleanAct = (row.ActivityDisplay || "").split('\n')[0].trim();
        const master = masterMap.get(cleanAct);
        return master !== undefined && master.aap === true; // Strict AAP filter[cite: 1]
      })
      .map((row, index) => {
        if (index === 0) firstDateRaw = row.ActivityDateDisplay;
        const cleanAct = (row.ActivityDisplay || "").split('\n')[0].trim();
        const nric = (row.RegistrationDocumentNumber || "").trim().toUpperCase();
        const master = masterMap.get(cleanAct);

        return {
          activitydatedisplay: formatToISODate(row.ActivityDateDisplay),
          activitydisplay: cleanAct,
          fullname: row.FullName || "",
          age: row.Age || "",
          postalcode1: row.PostalCode || "",
          gender: row.Gender || "",
          registrationdocumentnumber: nric,
          gui: master ? master.gui : false,
          cfs: cprMap.get(nric) || "" // CFS mapped from CPR file
        };
      });

    const csv = Papa.unparse(results);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement("a");
    const fileTs = getFileTimestamp(firstDateRaw);
    link.href = URL.createObjectURL(blob);
    link.download = `etl_activity_${fileTs}.csv`;
    link.click();
    document.getElementById('status').innerText = `Success: ${results.length} rows exported.`;
  }
</script>
</body>
</html>
